[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Building functions...' && ls -la netlify/functions/"

[[redirects]]
  from = "/"
  to = "/Atlas/Free/signup.html"
  status = 200

[[redirects]]
  from = "/Paid/*"
  to = "/.netlify/functions/servePaidContent?page=:splat"
  status = 200

[[redirects]]
  from = "/paid/*"
  to = "/.netlify/functions/servePaidContent?page=:splat"
  status = 200
