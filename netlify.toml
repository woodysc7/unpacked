[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install && cd netlify/functions && npm install"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/Paid/*"
  to = "/.netlify/functions/servePaidContentNew?page=:splat"
  status = 200

[[redirects]]
  from = "/paid/*"
  to = "/.netlify/functions/servePaidContentNew?page=:splat"
  status = 200

# Note: /PaidContent/* serves static files directly with client-side auth-check.js
