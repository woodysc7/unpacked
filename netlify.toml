# Allow free content access
[[redirects]]
  from = "/Free/*"
  to = "/Free/:splat"
  status = 200

# Redirect root access to signup for first-time users
[[redirects]]
  from = "/"
  to = "/Free/signup.html"
  status = 200

[build]
  functions = "netlify/functions"
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/Paid/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
