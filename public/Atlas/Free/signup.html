<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up / Login</title>
  <!-- Firebase v8 SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    body { font-family: Montserrat, Arial, sans-serif; background: #faf9f6; color: #4B3425; }
    .auth-container { max-width: 400px; margin: 90px auto; background: #fff; padding: 2em; border-radius: 18px; box-shadow: 0 2px 12px #0001; }
    input, button { font-size: 1.1em; margin: 0.4em 0; padding: 0.6em; width: 100%; border-radius: 8px; border: 1px solid #E3D8C8;}
    button { background: #6B4226; color: #fff; font-weight: 700; border: none; cursor: pointer; margin-top: 1em;}
    button:hover { background: #A9746E;}
    .error { color: #cf1b1b; margin-top: 0.8em;}
    .success { color: #2d902d; margin-top: 0.8em;}
    #pay-btn { background: #e3d8c8; color: #a17160; margin-top: 1.5em; border: none; font-weight: 700;}
    #pay-btn:hover { background: #c3b4a5; }
    #free-btn { background: #6B4226; color: #fff; margin-top: 1em; border: none; font-weight: 700; font-size: 1.1em; padding: 0.6em; width: 100%; border-radius: 8px; cursor: pointer;}
    #free-btn:hover { background: #A9746E; }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Sign Up / Login</h2>
    <form id="authForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" id="loginBtn">Login</button>
      <button type="button" id="signupBtn">Sign Up</button>
      <div class="error" id="errorMsg"></div>
      <div class="success" id="successMsg"></div>
    </form>
    <button id="pay-btn" style="display:none;">Upgrade to Premium</button>
    <button id="free-btn" onclick="window.location.href='Atlas.html'">Continue to Free Atlas</button>
  </div>
  <script>
    // Login and Signup handlers
    const authForm = document.getElementById('authForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const payBtn = document.getElementById('pay-btn');

    // Helper: Show/Hide Pay button depending on auth state
    function updatePayButton() {
      if (firebase.auth().currentUser) {
        payBtn.style.display = 'block';
      } else {
        payBtn.style.display = 'none';
      }
    }

    // Listen for real-time auth state changes
    firebase.auth().onAuthStateChanged(user => {
      updatePayButton();
    });

    // Login
    authForm.onsubmit = function(e) {
      e.preventDefault();
      errorMsg.textContent = "";
      successMsg.textContent = "";
      loginBtn.disabled = true;
      signupBtn.disabled = true;
      firebase.auth().signInWithEmailAndPassword(emailInput.value, passwordInput.value)
        .then(() => {
          successMsg.textContent = "Logged in successfully!";
          updatePayButton();
        })
        .catch(error => {
          errorMsg.textContent = error.message;
        })
        .finally(() => {
          loginBtn.disabled = false;
          signupBtn.disabled = false;
        });
    };

    // Signup
    signupBtn.onclick = function(e) {
      e.preventDefault();
      errorMsg.textContent = "";
      successMsg.textContent = "";
      loginBtn.disabled = true;
      signupBtn.disabled = true;
      firebase.auth().createUserWithEmailAndPassword(emailInput.value, passwordInput.value)
        .then(() => {
          successMsg.textContent = "Account created & signed in!";
          updatePayButton();
        })
        .catch(error => {
          errorMsg.textContent = error.message;
        })
        .finally(() => {
          loginBtn.disabled = false;
          signupBtn.disabled = false;
        });
    };

    // Payment (Upgrade) Button
    payBtn.onclick = async function() {
      const user = firebase.auth().currentUser;
      if (!user) {
        alert("Please sign in first!");
        return;
      }
      payBtn.disabled = true;
      payBtn.textContent = "Redirecting...";
      try {
        const token = await user.getIdToken();
        const response = await fetch('/.netlify/functions/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            uid: user.uid,
            email: user.email,
            token
          })
        });
        const data = await response.json();
        if (data.url) {
          window.location.href = data.url;

          errorMsg.textContent = data.error || "Could not create checkout session.";
  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD2-Ns0c-yTGIjmTcLOC5koCBiLFGHVs9I",
      authDomain: "unpacked-1b2b1.firebaseapp.com",
      projectId: "unpacked-1b2b1",
      storageBucket: "unpacked-1b2b1.firebasestorage.app",
      messagingSenderId: "59965033310",
      appId: "1:59965033310:web:ac0ed69b6f5727c0561dcf",
      measurementId: "G-8XX716E629"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const authForm = document.getElementById('authForm');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const payBtn = document.getElementById('pay-btn');
    const freeBtn = document.getElementById('free-btn');

    loginBtn.onclick = async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      successMsg.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        // Check if user has paid status
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists() && userDoc.data().paid) {
          successMsg.textContent = 'Login successful! Redirecting to paid content...';
          // Get Firebase ID token and redirect with authentication
          const token = await user.getIdToken();
          setTimeout(() => {
            window.location.href = `/.netlify/functions/servePaidContent?page=Atlas&token=${token}`;
          }, 1000);
        } else {
          successMsg.textContent = 'Login successful! Please purchase access to view paid content.';
          payBtn.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = err.message;
      }
    };

    signupBtn.onclick = async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      successMsg.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        // Create user record in Firestore (mark as not paid yet)
        await db.collection('users').doc(userCredential.user.uid).set({
          email: email,
          paid: false,
          createdAt: new Date()
        });
        successMsg.textContent = 'Sign up successful! Please log in.';
      } catch (err) {
        errorMsg.textContent = err.message;
      }
    };

    freeBtn.onclick = (e) => {
      e.preventDefault();
      window.location.href = 'Atlas.html';
    };

    payBtn.onclick = async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      successMsg.textContent = '';
      
      try {
        payBtn.disabled = true;
        payBtn.textContent = "Processing...";
        
        const user = auth.currentUser;
        if (!user) {
          errorMsg.textContent = "Please log in first";
          payBtn.disabled = false;
          payBtn.textContent = "Upgrade to Premium";
          return;
        }

        const response = await fetch('/.netlify/functions/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: user.uid, email: user.email })
        });

        if (response.ok) {
          const { url } = await response.json();
          window.location.href = url;
        } else {
          throw new Error('Failed to create checkout session');
        }
      } catch (err) {
        errorMsg.textContent = err.message;
        payBtn.disabled = false;
        payBtn.textContent = "Upgrade to Premium";
      }
    };
  </script>
</body>
</html>
