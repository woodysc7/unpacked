<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Access Admin</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="/firebase.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        .section { background: #f9f9f9; padding: 15px; margin: 15px 0; border-radius: 5px; }
        .user-item { background: white; padding: 10px; margin: 5px 0; border-radius: 3px; border-left: 4px solid #007cba; }
        .paid { border-left-color: #28a745; }
        .whitelist { border-left-color: #ffc107; }
        button { background: #007cba; color: white; padding: 8px 15px; border: none; border-radius: 3px; cursor: pointer; margin: 2px; }
        button:hover { background: #005a87; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #c82333; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 3px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>
    <h1>User Access Management</h1>
    
    <div class="section">
        <h3>Admin Login</h3>
        <input type="email" id="adminEmail" placeholder="Admin email" value="woodysc7@gmail.com">
        <input type="password" id="adminPassword" placeholder="Password">
        <button onclick="adminLogin()">Login as Admin</button>
        <div id="loginStatus"></div>
    </div>

    <div class="section">
        <h3>Add User Access</h3>
        <input type="email" id="userEmail" placeholder="User email">
        <button onclick="addToPaid()">Add to Paid Users</button>
        <button onclick="addToWhitelist()">Add to Whitelist (Free)</button>
        <div id="addResult"></div>
    </div>

    <div class="section">
        <h3>Current Paid Users</h3>
        <button onclick="loadPaidUsers()">Refresh</button>
        <div id="paidUsers"></div>
    </div>

    <div class="section">
        <h3>Current Whitelisted Users</h3>
        <button onclick="loadWhitelistUsers()">Refresh</button>
        <div id="whitelistUsers"></div>
    </div>

    <script>
        const auth = firebase.auth();
        const db = firebase.firestore();
        let isAdminLoggedIn = false;

        async function adminLogin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const statusDiv = document.getElementById('loginStatus');

            try {
                await auth.signInWithEmailAndPassword(email, password);
                isAdminLoggedIn = true;
                statusDiv.innerHTML = '<span class="success">✓ Admin logged in</span>';
                loadPaidUsers();
                loadWhitelistUsers();
            } catch (error) {
                statusDiv.innerHTML = `<span class="error">Login failed: ${error.message}</span>`;
            }
        }

        async function addToPaid() {
            if (!isAdminLoggedIn) {
                alert('Please login as admin first');
                return;
            }

            const email = document.getElementById('userEmail').value.trim();
            const resultDiv = document.getElementById('addResult');
            
            if (!email) {
                resultDiv.innerHTML = '<span class="error">Please enter an email</span>';
                return;
            }

            try {
                // Find user by email to get their UID
                const userQuery = await db.collection('users').where('email', '==', email).get();
                
                if (userQuery.empty) {
                    resultDiv.innerHTML = `<span class="error">User ${email} not found. They need to sign up first.</span>`;
                    return;
                }

                const userDoc = userQuery.docs[0];
                const userId = userDoc.id;

                // Add to paid collection
                await db.collection('paid').doc(userId).set({
                    email: email,
                    paid: true,
                    timestamp: new Date(),
                    addedBy: 'admin'
                });

                resultDiv.innerHTML = `<span class="success">✓ Added ${email} to paid users</span>`;
                document.getElementById('userEmail').value = '';
                loadPaidUsers();

            } catch (error) {
                resultDiv.innerHTML = `<span class="error">Error: ${error.message}</span>`;
            }
        }

        async function addToWhitelist() {
            if (!isAdminLoggedIn) {
                alert('Please login as admin first');
                return;
            }

            const email = document.getElementById('userEmail').value.trim();
            const resultDiv = document.getElementById('addResult');
            
            if (!email) {
                resultDiv.innerHTML = '<span class="error">Please enter an email</span>';
                return;
            }

            try {
                // Find user by email to get their UID
                const userQuery = await db.collection('users').where('email', '==', email).get();
                
                if (userQuery.empty) {
                    resultDiv.innerHTML = `<span class="error">User ${email} not found. They need to sign up first.</span>`;
                    return;
                }

                const userDoc = userQuery.docs[0];
                const userId = userDoc.id;

                // Add to whitelist collection
                await db.collection('whitelist').doc(userId).set({
                    email: email,
                    timestamp: new Date(),
                    reason: 'Admin granted free access',
                    addedBy: 'admin'
                });

                resultDiv.innerHTML = `<span class="success">✓ Added ${email} to whitelist (free access)</span>`;
                document.getElementById('userEmail').value = '';
                loadWhitelistUsers();

            } catch (error) {
                resultDiv.innerHTML = `<span class="error">Error: ${error.message}</span>`;
            }
        }

        async function loadPaidUsers() {
            const container = document.getElementById('paidUsers');
            container.innerHTML = 'Loading...';

            try {
                const snapshot = await db.collection('paid').get();
                let html = '';
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div class="user-item paid">
                            <strong>${data.email}</strong> (UID: ${doc.id})<br>
                            Added: ${data.timestamp ? data.timestamp.toDate().toLocaleDateString() : 'Unknown'}
                            <button class="danger" onclick="removeFromPaid('${doc.id}', '${data.email}')">Remove</button>
                        </div>
                    `;
                });

                container.innerHTML = html || 'No paid users found';
            } catch (error) {
                container.innerHTML = `<span class="error">Error loading paid users: ${error.message}</span>`;
            }
        }

        async function loadWhitelistUsers() {
            const container = document.getElementById('whitelistUsers');
            container.innerHTML = 'Loading...';

            try {
                const snapshot = await db.collection('whitelist').get();
                let html = '';
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div class="user-item whitelist">
                            <strong>${data.email}</strong> (UID: ${doc.id})<br>
                            Added: ${data.timestamp ? data.timestamp.toDate().toLocaleDateString() : 'Unknown'}
                            <button class="danger" onclick="removeFromWhitelist('${doc.id}', '${data.email}')">Remove</button>
                        </div>
                    `;
                });

                container.innerHTML = html || 'No whitelisted users found';
            } catch (error) {
                container.innerHTML = `<span class="error">Error loading whitelist users: ${error.message}</span>`;
            }
        }

        async function removeFromPaid(uid, email) {
            if (!confirm(`Remove ${email} from paid users?`)) return;

            try {
                await db.collection('paid').doc(uid).delete();
                alert(`Removed ${email} from paid users`);
                loadPaidUsers();
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        async function removeFromWhitelist(uid, email) {
            if (!confirm(`Remove ${email} from whitelist?`)) return;

            try {
                await db.collection('whitelist').doc(uid).delete();
                alert(`Removed ${email} from whitelist`);
                loadWhitelistUsers();
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }
    </script>
</body>
</html>
