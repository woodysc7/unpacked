<!DOCTYPE html>
<html>
<head>
    <title>scwood26 Access Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
        button { padding: 10px 20px; margin: 10px; background: #007cba; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #005a87; }
        .result { margin: 20px 0; padding: 15px; border-radius: 8px; }
        .success { background: #e8f5e8; border-left: 4px solid #4caf50; }
        .error { background: #ffebee; border-left: 4px solid #f44336; }
    </style>
</head>
<body>
    <h1>🔧 scwood26 Access Configuration</h1>
    
    <div>
        <h3>Current Status:</h3>
        <div id="status"></div>
    </div>
    
    <div>
        <h3>Actions:</h3>
        <button onclick="setScwood26Cookies()">Set scwood26 Cookies</button>
        <button onclick="checkServerAccess()">Check Server Access</button>
        <button onclick="testPaidContent()">Test Paid Content Access</button>
        <button onclick="clearCookies()">Clear All Cookies</button>
    </div>
    
    <div id="results"></div>
    
    <div style="margin-top: 30px;">
        <h3>Test Links:</h3>
        <a href="/PaidContent/Countries/unitedstates/unitedstateshome.html" target="_blank">🇺🇸 USA Page (Static)</a><br><br>
        <a href="/.netlify/functions/servePaidContent?page=Countries/unitedstates/unitedstateshome" target="_blank">🇺🇸 USA Page (Server)</a><br><br>
        <a href="/PaidContent/cities/newyorkunitedstates.html" target="_blank">🗽 NYC Page (Static)</a><br><br>
        <a href="/.netlify/functions/servePaidContent?page=cities/newyorkunitedstates" target="_blank">🗽 NYC Page (Server)</a>
    </div>

    <script>
        function updateStatus() {
            const cookies = document.cookie;
            const userEmail = getCookie('userEmail');
            const authToken = getCookie('authToken');
            
            document.getElementById('status').innerHTML = `
                <strong>Cookies:</strong> ${cookies || 'None'}<br>
                <strong>User Email:</strong> ${userEmail || 'None'}<br>
                <strong>Auth Token:</strong> ${authToken || 'None'}
            `;
        }
        
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }
        
        function setScwood26Cookies() {
            // Set proper cookies for scwood26
            document.cookie = `userEmail=${encodeURIComponent('scwood26@g.holycross.edu')}; path=/; max-age=86400; samesite=strict`;
            document.cookie = `authToken=firebase_token_scwood26; path=/; max-age=86400; samesite=strict`;
            
            document.getElementById('results').innerHTML = `
                <div class="result success">
                    ✅ scwood26 cookies set successfully!<br>
                    Email: scwood26@g.holycross.edu<br>
                    Token: firebase_token_scwood26
                </div>
            `;
            updateStatus();
        }
        
        async function checkServerAccess() {
            try {
                const response = await fetch('/.netlify/functions/checkUserAccess?email=scwood26@g.holycross.edu');
                const data = await response.json();
                
                if (data.hasAccess) {
                    document.getElementById('results').innerHTML = `
                        <div class="result success">
                            ✅ Server access check PASSED!<br>
                            Access Type: ${data.accessType}<br>
                            Whitelist: ${data.access.whitelist}<br>
                            Paid: ${data.access.paid}<br>
                            Users Paid: ${data.access.usersPaid}
                        </div>
                    `;
                } else {
                    document.getElementById('results').innerHTML = `
                        <div class="result error">
                            ❌ Server access check FAILED<br>
                            User found: ${data.found}<br>
                            Message: ${data.message || 'No access granted'}
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <div class="result error">
                        ❌ Error checking server access: ${error.message}
                    </div>
                `;
            }
        }
        
        async function testPaidContent() {
            try {
                const response = await fetch('/.netlify/functions/servePaidContent?page=Atlas');
                if (response.ok) {
                    document.getElementById('results').innerHTML = `
                        <div class="result success">
                            ✅ Paid content access GRANTED!<br>
                            Status: ${response.status}<br>
                            Content type: ${response.headers.get('content-type')}
                        </div>
                    `;
                } else {
                    document.getElementById('results').innerHTML = `
                        <div class="result error">
                            ❌ Paid content access DENIED<br>
                            Status: ${response.status}
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <div class="result error">
                        ❌ Error testing paid content: ${error.message}
                    </div>
                `;
            }
        }
        
        function clearCookies() {
            document.cookie = "userEmail=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            document.cookie = "authToken=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            document.cookie = "paid_access=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            
            document.getElementById('results').innerHTML = `
                <div class="result">🧹 All cookies cleared</div>
            `;
            updateStatus();
        }
        
        // Initialize
        updateStatus();
        
        // Auto-update status every 3 seconds
        setInterval(updateStatus, 3000);
    </script>
</body>
</html>
