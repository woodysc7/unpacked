<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug User Access</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="/firebase.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        .debug-box { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .email-check { background: #e3f2fd; padding: 15px; margin: 10px 0; border-radius: 5px; }
        button { background: #007cba; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        input { padding: 8px; margin: 5px; width: 300px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Debug User Access</h1>
    
    <div class="debug-box">
        <h3>Admin Login</h3>
        <input type="email" id="adminEmail" placeholder="Admin email" value="woodysc7@gmail.com">
        <small>Test with: woodysc7@gmail.com or Wyattlorenzen123@gmail.com</small>
        <input type="password" id="adminPassword" placeholder="Password">
        <button onclick="adminLogin()">Login</button>
        <div id="adminStatus"></div>
    </div>

    <div class="email-check">
        <h3>Check User by Email</h3>
        <input type="email" id="checkEmail" placeholder="User email to check" value="scwood26@g.holycross.edu">
        <button onclick="checkUserByEmail()">Check Access</button>
        <div id="checkResult"></div>
    </div>

    <div class="debug-box">
        <h3>All Collections Data</h3>
        <button onclick="dumpAllData()">Show All Users, Paid, Whitelist</button>
        <div id="allData"></div>
    </div>

    <script>
        const auth = firebase.auth();
        const db = firebase.firestore();
        let isLoggedIn = false;

        async function adminLogin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const statusDiv = document.getElementById('adminStatus');

            try {
                await auth.signInWithEmailAndPassword(email, password);
                isLoggedIn = true;
                statusDiv.innerHTML = '<span class="success">✓ Logged in</span>';
            } catch (error) {
                statusDiv.innerHTML = `<span class="error">Login failed: ${error.message}</span>`;
            }
        }

        async function checkUserByEmail() {
            if (!isLoggedIn) {
                alert('Please login first');
                return;
            }

            const email = document.getElementById('checkEmail').value;
            const resultDiv = document.getElementById('checkResult');
            resultDiv.innerHTML = 'Checking...';

            try {
                let userUID = null;
                let userData = null;

                // Find user in users collection
                const usersQuery = await db.collection('users').where('email', '==', email).get();
                if (!usersQuery.empty) {
                    const userDoc = usersQuery.docs[0];
                    userUID = userDoc.id;
                    userData = userDoc.data();
                }

                let result = `<h4>Results for ${email}:</h4>`;
                
                if (userUID) {
                    result += `<p><strong>Found in users collection:</strong></p>`;
                    result += `<pre>UID: ${userUID}\nData: ${JSON.stringify(userData, null, 2)}</pre>`;

                    // Check whitelist
                    const whitelistDoc = await db.collection('whitelist').doc(userUID).get();
                    if (whitelistDoc.exists) {
                        result += `<p><span class="success">✓ Found in whitelist:</span></p>`;
                        result += `<pre>${JSON.stringify(whitelistDoc.data(), null, 2)}</pre>`;
                    } else {
                        result += `<p><span class="error">✗ NOT in whitelist</span></p>`;
                    }

                    // Check paid
                    const paidDoc = await db.collection('paid').doc(userUID).get();
                    if (paidDoc.exists) {
                        result += `<p><span class="success">✓ Found in paid:</span></p>`;
                        result += `<pre>${JSON.stringify(paidDoc.data(), null, 2)}</pre>`;
                    } else {
                        result += `<p><span class="error">✗ NOT in paid</span></p>`;
                    }

                } else {
                    result += `<p><span class="error">✗ User not found in users collection</span></p>`;
                }

                resultDiv.innerHTML = result;

            } catch (error) {
                resultDiv.innerHTML = `<span class="error">Error: ${error.message}</span>`;
            }
        }

        async function dumpAllData() {
            if (!isLoggedIn) {
                alert('Please login first');
                return;
            }

            const resultDiv = document.getElementById('allData');
            resultDiv.innerHTML = 'Loading...';

            try {
                let result = '<h4>All Collections Data:</h4>';

                // Users collection
                const usersSnapshot = await db.collection('users').get();
                result += '<h5>Users Collection:</h5>';
                usersSnapshot.forEach(doc => {
                    result += `<pre>ID: ${doc.id}\nData: ${JSON.stringify(doc.data(), null, 2)}</pre>`;
                });

                // Whitelist collection
                const whitelistSnapshot = await db.collection('whitelist').get();
                result += '<h5>Whitelist Collection:</h5>';
                if (whitelistSnapshot.empty) {
                    result += '<p>No documents in whitelist collection</p>';
                } else {
                    whitelistSnapshot.forEach(doc => {
                        result += `<pre>ID: ${doc.id}\nData: ${JSON.stringify(doc.data(), null, 2)}</pre>`;
                    });
                }

                // Paid collection
                const paidSnapshot = await db.collection('paid').get();
                result += '<h5>Paid Collection:</h5>';
                if (paidSnapshot.empty) {
                    result += '<p>No documents in paid collection</p>';
                } else {
                    paidSnapshot.forEach(doc => {
                        result += `<pre>ID: ${doc.id}\nData: ${JSON.stringify(doc.data(), null, 2)}</pre>`;
                    });
                }

                resultDiv.innerHTML = result;

            } catch (error) {
                resultDiv.innerHTML = `<span class="error">Error: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
