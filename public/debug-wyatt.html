<!DOCTYPE html>
<html>
<head>
    <title>Wyatt Authentication Debug</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .test-section { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .success { background: #e8f5e8; border-left: 4px solid #4caf50; }
        .error { background: #ffebee; border-left: 4px solid #f44336; }
        button { padding: 10px 15px; margin: 5px; background: #007cba; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #005a87; }
        .result { margin: 10px 0; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🔍 Wyatt Authentication Debug</h1>
    
    <div class="test-section">
        <h3>Current Cookies</h3>
        <div id="currentCookies"></div>
    </div>

    <div class="test-section">
        <h3>Authentication Tests</h3>
        <button onclick="setWyattCookies()">Set Wyatt Auth Cookies</button>
        <button onclick="clearCookies()">Clear All Cookies</button>
        <button onclick="testPremiumAccess()">Test Premium Access</button>
        <div id="authResults"></div>
    </div>

    <div class="test-section">
        <h3>Quick Access Links</h3>
        <a href="/.netlify/functions/servePaidContent?page=Atlas&test=wyatt" target="_blank">🗺️ Premium Atlas (Test Parameter)</a><br><br>
        <a href="/premium-atlas-direct.html" target="_blank">🗺️ Premium Atlas Direct (Cookie Auth)</a><br><br>
        <a href="/?auto=wyatt" target="_blank">🔐 Auto-Login as Wyatt</a><br><br>
        <a href="/.netlify/functions/servePaidContent?page=cities/newyorkunitedstates&test=wyatt" target="_blank">🏙️ NYC City Page</a>
    </div>

    <script>
        function displayCookies() {
            const cookies = document.cookie || 'No cookies found';
            document.getElementById('currentCookies').innerHTML = `<code>${cookies}</code>`;
        }

        function setWyattCookies() {
            // Set the exact same cookies as the auto-login system
            document.cookie = `authToken=test_token_wyatt; path=/; max-age=86400; samesite=strict`;
            document.cookie = `userEmail=${encodeURIComponent('Wyattlorenzen123@gmail.com')}; path=/; max-age=86400; samesite=strict`;
            
            document.getElementById('authResults').innerHTML = `
                <div class="result success">
                    ✅ Wyatt authentication cookies set!<br>
                    authToken=test_token_wyatt<br>
                    userEmail=Wyattlorenzen123%40gmail.com
                </div>
            `;
            displayCookies();
        }

        function clearCookies() {
            // Clear all authentication cookies
            document.cookie = "authToken=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            document.cookie = "userEmail=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            document.cookie = "paid_access=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            
            document.getElementById('authResults').innerHTML = `
                <div class="result">🧹 All cookies cleared</div>
            `;
            displayCookies();
        }

        function testPremiumAccess() {
            const cookies = document.cookie;
            const hasAccess = cookies.includes('userEmail=Wyattlorenzen123%40gmail.com') || 
                            cookies.includes('authToken=test_token_wyatt') ||
                            cookies.includes('authToken=whitelist_token');
            
            if (hasAccess) {
                document.getElementById('authResults').innerHTML = `
                    <div class="result success">
                        ✅ Premium access GRANTED for Wyatt!<br>
                        Cookie check passed.
                    </div>
                `;
            } else {
                document.getElementById('authResults').innerHTML = `
                    <div class="result error">
                        ❌ Premium access DENIED for Wyatt<br>
                        No valid authentication cookies found.
                    </div>
                `;
            }
        }

        // Initialize
        displayCookies();
        
        // Auto-update cookies display every 2 seconds
        setInterval(displayCookies, 2000);
    </script>
</body>
</html>
