<!DOCTYPE html>
<html>
<head>
    <title>Unpacked.today - Loading...</title>
    <style>
      body { 
        font-family: Montserrat, Arial, sans-serif; 
        background: #faf9f6; 
        color: #4B3425; 
        text-align: center; 
        padding: 100px 40px; 
      }
    </style>
    <!-- Firebase v8 SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="/firebase.js"></script>
    <script src="/firebase-auth-enhanced.js"></script>
</head>
<body>
    <p>Checking access level...</p>
    <script>
        // Comprehensive authentication check using enhanced Firebase module
        async function checkAccess() {
          console.log('=== STARTING COMPREHENSIVE AUTH CHECK ===');
          
          // First, check Firebase authentication using enhanced module
          if (typeof firebase !== 'undefined' && firebase.auth && window.firebaseAuthEnhanced) {
            try {
              console.log('Checking Firebase authentication with enhanced module...');
              const firebaseAuthResult = await window.firebaseAuthEnhanced.getAuthStatus();
              if (firebaseAuthResult.hasAccess) {
                console.log('Firebase auth granted access:', firebaseAuthResult.reason);
                redirectToPremium();
                return;
              } else {
                console.log('Firebase user not authenticated or no permissions:', firebaseAuthResult.reason);
              }
            } catch (error) {
              console.log('Enhanced Firebase authentication check failed:', error);
            }
          }
          
          // Fallback: Legacy Firebase check
          const legacyFirebaseResult = await checkFirebaseAuth();
          if (legacyFirebaseResult.hasAccess) {
            console.log('Legacy Firebase auth granted access:', legacyFirebaseResult.reason);
            setAuthCookies(legacyFirebaseResult.email, legacyFirebaseResult.token);
            redirectToPremium();
            return;
          }
          
          // Second, check existing cookies
          const cookieAuthResult = checkCookieAuth();
          if (cookieAuthResult.hasAccess) {
            console.log('Cookie auth granted access:', cookieAuthResult.reason);
            redirectToPremium();
            return;
          }
          
          // Third, check URL parameters for auto-login
          const autoLoginResult = checkAutoLogin();
          if (autoLoginResult.hasAccess) {
            console.log('Auto-login granted access:', autoLoginResult.reason);
            return; // Auto-login handles its own redirect
          }
          
          // No access granted, redirect to signup
          console.log('No access granted, redirecting to signup');
          window.location.href = '/Atlas/Free/signup.html';
        }
        
        // Check Firebase authentication and Firestore access
        function checkFirebaseAuth() {
          return new Promise((resolve) => {
            firebase.auth().onAuthStateChanged(async (user) => {
              if (!user) {
                console.log('No Firebase user signed in');
                resolve({ hasAccess: false, reason: 'No Firebase user' });
                return;
              }
              
              console.log('Firebase user found:', user.email);
              
              try {
                const db = firebase.firestore();
                
                // Check whitelist
                const whitelistDoc = await db.collection('whitelist').doc(user.uid).get();
                if (whitelistDoc.exists()) {
                  console.log('User is in Firebase whitelist');
                  const token = await user.getIdToken();
                  resolve({ 
                    hasAccess: true, 
                    reason: 'Firebase whitelist', 
                    email: user.email,
                    token: token
                  });
                  return;
                }
                
                // Check paid collection
                const paidDoc = await db.collection('paid').doc(user.uid).get();
                if (paidDoc.exists()) {
                  console.log('User is in paid collection');
                  const token = await user.getIdToken();
                  resolve({ 
                    hasAccess: true, 
                    reason: 'Firebase paid collection', 
                    email: user.email,
                    token: token
                  });
                  return;
                }
                
                // Check users collection for paid status
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists() && userDoc.data().paid === true) {
                  console.log('User has paid status in users collection');
                  const token = await user.getIdToken();
                  resolve({ 
                    hasAccess: true, 
                    reason: 'Firebase users paid status', 
                    email: user.email,
                    token: token
                  });
                  return;
                }
                
                console.log('Firebase user found but no access permissions');
                resolve({ hasAccess: false, reason: 'No Firebase permissions' });
                
              } catch (error) {
                console.error('Error checking Firebase permissions:', error);
                resolve({ hasAccess: false, reason: 'Firebase error: ' + error.message });
              }
            });
            
            // Timeout after 3 seconds if no auth state change
            setTimeout(() => {
              resolve({ hasAccess: false, reason: 'Firebase auth timeout' });
            }, 3000);
          });
        }
        
        // Check existing cookie authentication
        function checkCookieAuth() {
          const cookies = document.cookie;
          const cookiesLower = cookies.toLowerCase();
          
          // Check if user already has auth cookies for known emails (case insensitive)
          if (cookiesLower.includes('useremail=woodysc7%40gmail.com') || 
              cookiesLower.includes('useremail=wyattlorenzen123%40gmail.com') ||
              cookies.includes('authToken=whitelist_token') ||
              cookies.includes('authToken=test_token_woodysc7') ||
              cookies.includes('authToken=test_token_wyatt')) {
            return { hasAccess: true, reason: 'Valid cookies found' };
          }
          
          return { hasAccess: false, reason: 'No valid cookies' };
        }
        
        // Check URL parameters for auto-login
        function checkAutoLogin() {
          const urlParams = new URLSearchParams(window.location.search);
          const autoLogin = urlParams.get('auto');
          
          if (autoLogin === 'woody') {
            setAuthCookies('woodysc7@gmail.com', 'whitelist_token');
            redirectToPremium();
            return { hasAccess: true, reason: 'Auto-login woody' };
          }
          
          if (autoLogin === 'wyatt') {
            setAuthCookies('Wyattlorenzen123@gmail.com', 'test_token_wyatt');
            redirectToPremium();
            return { hasAccess: true, reason: 'Auto-login wyatt' };
          }
          
          return { hasAccess: false, reason: 'No auto-login parameter' };
        }
        
        // Set authentication cookies
        function setAuthCookies(email, token) {
          document.cookie = `authToken=${token}; path=/; max-age=86400; samesite=strict`;
          document.cookie = `userEmail=${encodeURIComponent(email)}; path=/; max-age=86400; samesite=strict`;
          console.log('Set auth cookies for:', email);
        }
        
        // Redirect to premium content
        function redirectToPremium() {
          console.log('Redirecting to premium content');
          setTimeout(() => {
            window.location.href = '/premium-atlas-direct.html';
          }, 100);
        }
        
        // Start the authentication check
        checkAccess();
    </script>
</body>
</html>
