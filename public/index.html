<!DOCTYPE html>
<html>
<head>
    <title>Unpacked.today - Loading...</title>
    <style>
      body { 
        font-family: Montserrat, Arial, sans-serif; 
        background: #faf9f6; 
        color: #4B3425; 
        text-align: center; 
        padding: 100px 40px; 
      }
    </style>
</head>
<body>
    <p>Checking access level...</p>
    <script>
        // Check if user is whitelisted based on cookies
        function checkAccess() {
          const cookies = document.cookie;
          const cookiesLower = cookies.toLowerCase();
          
          // Check if user already has auth cookies for your email (case insensitive)
          if (cookiesLower.includes('useremail=woodysc7%40gmail.com') || 
              cookiesLower.includes('useremail=wyattlorenzen123%40gmail.com') ||
              cookiesLower.includes('useremail=scwood26%40g.holycross.edu') ||
              cookies.includes('authToken=whitelist_token') ||
              cookies.includes('authToken=test_token_woodysc7') ||
              cookies.includes('authToken=test_token_wyatt') ||
              cookies.includes('authToken=test_token_scwood26')) {
            // Redirect to premium content
            window.location.href = '/premium-atlas-direct.html';
            return;
          }
          
          // Check URL parameters for auto-login
          const urlParams = new URLSearchParams(window.location.search);
          const autoLogin = urlParams.get('auto');
          
          if (autoLogin === 'woody') {
            // Set authentication cookies for your access (remove secure flag for testing)
            document.cookie = `authToken=whitelist_token; path=/; max-age=86400; samesite=strict`;
            document.cookie = `userEmail=${encodeURIComponent('woodysc7@gmail.com')}; path=/; max-age=86400; samesite=strict`;
            
            // Add debug info
            console.log('Setting cookies for auto-login');
            console.log('Cookies after setting:', document.cookie);
            
            // Small delay to ensure cookies are set
            setTimeout(() => {
              window.location.href = '/premium-atlas-direct.html';
            }, 100);
            return;
          }
          
          if (autoLogin === 'wyatt') {
            // Set authentication cookies for wyatt access
            document.cookie = `authToken=test_token_wyatt; path=/; max-age=86400; samesite=strict`;
            document.cookie = `userEmail=${encodeURIComponent('Wyattlorenzen123@gmail.com')}; path=/; max-age=86400; samesite=strict`;
            
            // Add debug info
            console.log('Setting cookies for wyatt auto-login');
            console.log('Cookies after setting:', document.cookie);
            
            // Small delay to ensure cookies are set
            setTimeout(() => {
              window.location.href = '/premium-atlas-direct.html';
            }, 100);
            return;
          }
          
          if (autoLogin === 'scwood26') {
            // Set authentication cookies for scwood26 access
            document.cookie = `authToken=test_token_scwood26; path=/; max-age=86400; samesite=strict`;
            document.cookie = `userEmail=${encodeURIComponent('scwood26@g.holycross.edu')}; path=/; max-age=86400; samesite=strict`;
            
            // Add debug info
            console.log('Setting cookies for scwood26 auto-login');
            console.log('Cookies after setting:', document.cookie);
            
            // Small delay to ensure cookies are set
            setTimeout(() => {
              window.location.href = '/premium-atlas-direct.html';
            }, 100);
            return;
          }
          
          // Default: redirect to signup page
          window.location.href = '/Atlas/Free/signup.html';
        }
        
        checkAccess();
    </script>
</body>
</html>
